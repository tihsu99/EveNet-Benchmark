schema_version: 1
# Storage root: data/ holds shared assets; version/<name>/ holds each evaluation.
# Checkpoints and Ray Train/Predict results stay under version/<name>/results/<probe>/.
# Relative roots resolve against this YAML; environment variables are supported.
download_root: /pscratch/sd/t/tihsu/database/EveNet-BenchMark
suite: probe.yaml
reference: paper_reference.yaml
backend: local

# The driver attaches to a cluster you start manually. No ray start/stop commands
# are issued by this project. Set address to null for native single-node Ray.
ray:
  address: auto
  wait_timeout: 300

# Capacity of the existing allocation. Per-probe workers/batches are in probe.yaml.
resources:
  nodes: 4
  gpus_per_node: 4
  cpus_per_node: 128
  cpus_per_worker: 30
  max_parallel: 4
  # Optional Slurm driver submission. Only one CPU driver task is submitted.
  driver_cpus: 2
  time: '02:00:00'
  account: null
  qos: null
  partition: null
  constraint: null

runtime:
  # Launch from the host: analysis environments must stay outside Shifter.
  # Create this shared directory before launch; all Python runtimes use it.
  # Existing Ray session/artifact paths still require a cluster-side migration.
  driver: [env, &scratch_tmp TMPDIR=/pscratch/ad/t/tihsu/tmp, /pscratch/sd/t/tihsu/env/benchmark/bin/python]
  # Ray head/workers must be started with this same host/container mount.
  python: [shifter, '--volume=/tmp/ray:/tmp/ray', env, *scratch_tmp, python3]
  analysis_python: [env, *scratch_tmp, /pscratch/sd/t/tihsu/env/benchmark/bin/python]
  # Only used by backend: slurm; image is placed in the SBATCH header.
  image: null
  shifter_args: []

conditions:
  benchmarks: [qe, exotic_higgs_cls, exotic_higgs_asn, exotic_higgs_seg, anomaly]
  suite_overrides:
    prediction:
      batch_size_multiplier: 4
    benchmarks:
      anomaly:
        execution:
          prediction_python: [env, *scratch_tmp, /pscratch/sd/t/tihsu/env/benchmark/bin/python]
          native_on_driver: true
      qe:
        execution:
          analysis_python: [env, *scratch_tmp, /pscratch/sd/t/tihsu/env/unfold/bin/python]
        # If libRooUnfold is not on this environment's library search path:
        # evaluation:
        #   roounfold_library: /absolute/path/to/libRooUnfold.so

# A local checkout can replace any source: {path: /path/to/checkout}.
# Public Git revisions and Hub revisions are pinned, not moving branches.
sources:
  EVENET_CORE:
    url: https://github.com/EveNet-HEP/EveNet-Full.git
    revision: 06c3181d9a0f7df3e30edbb1c355b6fec8b5a3ad
    local_dir: sources/EveNet-Full
  QE_REPO:
    url: https://github.com/EveNet-HEP/TT2L-QC-Study.git
    revision: ba0f9050cee8ae6eb799dbb59d37a1cc331343d7
    local_dir: sources/TT2L-QC-Study
  HIGGS_REPO:
    url: https://github.com/EveNet-HEP/Exotic-Higgs-Study.git
    revision: c248a12749479f4d58778e76e10449a4d1d0292a
    local_dir: sources/Exotic-Higgs-Study
  ANOMALY_REPO:
    url: https://github.com/EveNet-HEP/CMSOpenData-Upsilon-AnomalyDetection.git
    revision: ff4f16845a7919d8c3e49f29240f9d79071e2a64
    local_dir: sources/CMSOpenData-Upsilon-AnomalyDetection

downloads:
  HF_MODELS:
    repo_id: Avencast/EveNet
    repo_type: model
    revision: afba5b47478f0c25c6a5a5755ac30738925d73ad
    local_dir: models
    allow_patterns: [checkpoints.20M.a4.last.ckpt, SSL.20M.last.ckpt]
  QE_DATA:
    repo_id: Avencast/EveNet-TT2L-QuantumCorrelation
    repo_type: dataset
    revision: f710a2216aaaef6673ed6b9a3dc064dceb65c84c
    local_dir: qe
    allow_patterns: ['train/*.parquet', 'val/*.parquet', 'test/*.parquet', 'train/normalization.pt', 'train/shape_metadata.json']
  HIGGS_DATA:
    repo_id: Avencast/EveNet-ExoticHiggs-H2a4b
    repo_type: dataset
    revision: 277309507ff23cd63d1d7755605e72c2cd2c3699
    local_dir: higgs
    allow_patterns:
      - 'evenet-train/evenet-ma30/*.parquet'
      - 'evenet-test/evenet-ma30/*.parquet'
      - 'evenet-train/evenet-ma30/normalization.pt'
      - 'evenet-train/evenet-ma30/shape_metadata.json'
    # Hub globs match slashes; explicitly omit nested systematic variations.
    ignore_patterns: ['*/*/*/*']

  ANOMALY_DATA:
    repo_id: tihsu/AD-Data
    repo_type: dataset
    revision: f22f837bdca3809fe1518fddc42ccc9a07e33f6e
    local_dir: anomaly
    allow_patterns:
      - SB/data.parquet
      - SB/normalization.pt
      - SB/shape_metadata.json
      - SR/data.parquet

variables:
  HIGGS_TRAIN_DATA: '${HIGGS_DATA}/evenet-train/evenet-ma30'
  HIGGS_TEST_DATA: '${HIGGS_DATA}/evenet-test/evenet-ma30'

candidate:
  checkpoint: '${HF_MODELS}/checkpoints.20M.a4.last.ckpt'
  network: '${EVENET_CORE}/share/network/network-20M.yaml'
  weight_source: state_dict
