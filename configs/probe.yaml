schema_version: 1
seed: 20261007
core: ${EVENET_CORE}
wandb_project: EveNet-Benchmark

# Commands are argv lists. A container prefix is supported, for example:
# python: [shifter, "--image=docker:avencast1994/evenet:1.5", python3]
# analysis_python may use a different environment providing ROOT/RooUnfold/JetNet.
execution:
  python: [python3]
  analysis_python: [python3]
  wandb_mode: online

# Import-only checks run in the same task runtimes as the real pipeline.
preflight:
  driver:
    imports: [ray, benchmark.run, benchmark.plot]
  training:
    imports: [torch, lightning, ray.train.torch, pyarrow, evenet.network.evenet_model]
    scripts: ["${EVENET_CORE}/scripts/train.py", "${EVENET_CORE}/scripts/predict.py"]
    required_env: [WANDB_API_KEY]
  evaluation:
    imports: [torch, sklearn.metrics]

# Per-GPU inference batch relative to training; does not change training resources.
# A probe's prediction.batch_size_multiplier overrides this shared value.
# A probe's evaluation.batch_size sets an absolute inference batch instead.
prediction:
  batch_size_multiplier: 4

# Paper fine-tuning is declared per task, separately from scratch training.
# Explicit overrides here or per task take precedence over mode-specific settings.
adaptation:
  logger:
    wandb:
      entity: ytchou97-university-of-washington
  platform:
    resources_per_worker: {CPU: 30, GPU: 1}
    use_gpu: true

# New task heads may initialize independently. Backbone mismatches fail closed.
# Add narrowly scoped exceptions only after inspecting load_audit.json.
load_policy:
  required: ["GlobalEmbedding.*", "PET.*", "ObjectEncoder.*", "PairCreator.*"]
  allowed_missing: ["*_normalizer.*"]
  allowed_unused: []

benchmarks:
  qe:
    enabled: true
    label: QE / quantum correlation
    repository: ${QE_REPO}
    train_yaml: ${QE_REPO}/examples/Train_example.yaml
    predict_yaml: ${QE_REPO}/examples/Predict_example.yaml
    normalization_asset: normalization.pt
    # Sec. II.3 / Table 2: pretrained encoder at 0.1 times the head base LR.
    # Train_example.yaml is a scratch recipe; loading weights alone does not change LR.
    pretrained_overrides:
      options:
        Training:
          learning_rate_body: &qe_body_lr 0.000005
          Components:
            GlobalEmbedding: {learning_rate: *qe_body_lr}
            PET: {learning_rate: *qe_body_lr}
            ObjectEncoder: {learning_rate: *qe_body_lr}
    preflight:
      evaluation:
        imports: [torch, ROOT]
        # The quantum adapter also imports analysis.py and checks RooUnfold classes.
    # GPUs: paper Table 2; per-worker batch: pinned Train_example.yaml.
    overrides:
      platform: {number_of_workers: 16, batch_size: 1024}
      options:
        Training:
          learning_rate: &qe_head_lr 0.00005
          learning_rate_factor: 1.0
          # Cheaper training diagnostics; final prediction restores the native step count.
          diffusion_every_n_epochs: 100
          Components:
            # The pair core adds this projector to the generation optimizer first;
            # set its rate/type explicitly so it cannot silently select Lion.
            InvisibleInputProjector:
              learning_rate: *qe_head_lr
              optimizer_group: truth_generation
              optimizer_type: adamw
              weight_decay: 0.01
            TruthGeneration:
              learning_rate: *qe_head_lr
              optimizer_group: truth_generation
              optimizer_type: adamw
              diffusion_steps: 20
    prediction:
      overrides:
        options:
          Training:
            Components:
              TruthGeneration: {diffusion_steps: 200}
    data:
      train: ["${QE_DATA}/train/*.parquet"]
      validation: ["${QE_DATA}/val/*.parquet"]
      evaluation: ["${QE_DATA}/test/*.parquet"]
      train_fraction: 0.05
      # Optional genuine unique event-ID columns, including process ID if needed.
      # Without these, identity is source content hash + row index.
      event_id_columns: []
      assets:
        normalization.pt: ${QE_DATA}/train/normalization.pt
        shape_metadata.json: ${QE_DATA}/train/shape_metadata.json
    evaluation:
      kind: quantum
      observable: Concurrence
      trace_coefficients: [C_nn, C_rr, C_kk]
      display:
        - {key: trace_abs_bias, label: "Trace absolute bias", direction: min}
        - {key: observable_abs_bias, label: "Concurrence bias", direction: min}
        - {key: observable_uncertainty, label: "Concurrence uncertainty", direction: min, headline: true}
        - {key: selection_efficiency, label: "Selection efficiency", direction: none}

  exotic_higgs_cls: &higgs_task
    enabled: true
    label: Exotic Higgs / Cls
    group: exotic_higgs
    group_label: Exotic Higgs / head comparison
    variant_label: Cls
    data_group: exotic_higgs
    repository: ${HIGGS_REPO}
    train_yaml: ${HIGGS_REPO}/configs/train.yaml
    predict_yaml: ${HIGGS_REPO}/configs/predict.yaml
    # Explicit quick-probe hypothesis. Change together with the data paths.
    template_tokens: {MASS: "30"}
    normalization_asset: normalization.pt
    # Sec. IV: all active modules train, with PET/intermediate/head LR 0.1/0.3/1.
    # Mapping follows Higgs options_pretrain.yaml; distinct groups preserve the rates.
    pretrained_overrides:
      options:
        Training:
          learning_rate_body: &higgs_body_lr 0.00004
          learning_rate_intermediate: &higgs_intermediate_lr 0.00012
          Components:
            GlobalEmbedding:
              learning_rate: *higgs_intermediate_lr
              optimizer_group: intermediate
              optimizer_type: adamw
            PET:
              learning_rate: *higgs_body_lr
              optimizer_group: body
              optimizer_type: adamw
            ObjectEncoder:
              learning_rate: *higgs_intermediate_lr
              optimizer_group: intermediate
              optimizer_type: adamw
    # Paper epoch budget applies to scratch and pretrained candidates.
    epoch_budget:
      train_events_threshold: 99000
      below_threshold: 100
      at_or_above_threshold: 50
    overrides:
      # GPUs: paper Table 2; per-worker batch: pinned configs/train.yaml.
      platform: &higgs_platform {number_of_workers: 4, batch_size: 2048}
      options:
        Training: &higgs_training
          learning_rate: &higgs_head_lr 0.0004
          learning_rate_factor: 1.0
          learning_rate_warm_up_factor: 1.0
          EarlyStopping: {patience: 20}
          Components:
            Classification: {include: true, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Assignment: {include: false, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Segmentation: {include: false, learning_rate: *higgs_head_lr, optimizer_type: adamw}
          ProgressiveTraining: &higgs_schedule
            stages:
              - name: fixed_head_adaptation
                epoch_ratio: 1.0
                transition_ratio: 0.0
                loss_weights:
                  classification: [1.0, 1.0]
                  assignment: [1.0, 1.0]
                  segmentation: [1.0, 1.0]
                train_parameters:
                  ema_decay: [0.999, 0.999]
                  noise_prob: [1.0, 1.0]
                  reco_attn_mask: [0.0, 0.0]
    data:
      train: ["${HIGGS_TRAIN_DATA}/*.parquet"]
      validation_fraction: 0.2
      evaluation: ["${HIGGS_TEST_DATA}/*.parquet"]
      # Match raw archive dataset_size0.01 (paper label: 5% of 200 K).
      # This fraction applies after the validation split.
      train_fraction: 0.01
      event_id_columns: []
      assets:
        normalization.pt: ${HIGGS_TRAIN_DATA}/normalization.pt
        shape_metadata.json: ${HIGGS_TRAIN_DATA}/shape_metadata.json
    evaluation:
      kind: classification
      score_key: classification/signal
      score_index: 1
      target_key: subprocess_id
      signal_ids: [0]
      background_ids: [-1]
      weight_key: event_weight
      signal_efficiency: 0.7
      display:
        - {key: auc, label: "Weighted AUC", direction: max, headline: true}
        - {key: background_rejection, label: "Rejection at 70% signal", direction: max}
        - {key: sic, label: "SIC at selected threshold", direction: max}

  exotic_higgs_asn:
    <<: *higgs_task
    label: Exotic Higgs / Cls+Asn
    variant_label: Cls+Asn
    overrides:
      platform: *higgs_platform
      options:
        Training:
          <<: *higgs_training
          ProgressiveTraining: *higgs_schedule
          Components:
            Classification: {include: true, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Assignment: {include: true, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Segmentation: {include: false, learning_rate: *higgs_head_lr, optimizer_type: adamw}

  exotic_higgs_seg:
    <<: *higgs_task
    label: Exotic Higgs / Cls+Seg
    variant_label: Cls+Seg
    # The public Higgs dataset and native head use three target slots.
    network_overrides:
      Segmentation: {num_queries: 3}
    overrides:
      platform: *higgs_platform
      options:
        Training:
          <<: *higgs_training
          ProgressiveTraining: *higgs_schedule
          Components:
            Classification: {include: true, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Assignment: {include: false, learning_rate: *higgs_head_lr, optimizer_type: adamw}
            Segmentation: {include: true, learning_rate: *higgs_head_lr, optimizer_type: adamw}

  anomaly:
    enabled: true
    label: Upsilon / one-fold generation probe
    repository: ${ANOMALY_REPO}
    train_yaml: ${ANOMALY_REPO}/config/full_train.yaml
    workflow_yaml: ${ANOMALY_REPO}/config/workflow.yaml
    normalization_asset: normalization.pt
    # Sec. VI / Table 2, mapped as in the pinned AD options.yaml.
    # GlobalEmbedding is a full-rate conditioning module; PET/ObjectEncoder use 0.1x.
    pretrained_overrides:
      options:
        Training:
          learning_rate_body: &ad_body_lr 0.00005
          Components:
            PET: {learning_rate: *ad_body_lr}
            ObjectEncoder: {learning_rate: *ad_body_lr}
    # The paper's scratch baseline uses uniform LR, unlike the native pretrained YAML.
    scratch_overrides:
      options:
        Training:
          learning_rate_body: &ad_head_lr 0.0005
          Components:
            PET: {learning_rate: *ad_head_lr}
            ObjectEncoder: {learning_rate: *ad_head_lr}
    preflight:
      prediction:
        imports: [torch, numdifftools]
        scripts: ["${ANOMALY_REPO}/01predict_SR_certain_fold.py"]
      evaluation:
        imports: [torch, ray, awkward, vector, numdifftools, jetnet.evaluation, zfit]
        scripts: ["${ANOMALY_REPO}/02prepare_classification_dataset.py"]
    # Table 2 specifies 4 GPUs. Batch is from the public recipe (paper omits it).
    # The public recipe itself uses 2 GPUs; the paper GPU count takes precedence.
    overrides:
      platform:
        number_of_workers: 4
        batch_size: 4096
        resources_per_worker: {CPU: 28, GPU: 1}
      options:
        Training:
          learning_rate: *ad_head_lr
          learning_rate_factor: 1.0
          Components:
            GlobalEmbedding:
              learning_rate: *ad_head_lr
              optimizer_group: conditioning
              optimizer_type: adamw
            PET: {optimizer_group: body, optimizer_type: adamw}
            ObjectEncoder: {optimizer_group: object_encoder, optimizer_type: adamw}
            GlobalGeneration: {learning_rate: *ad_head_lr, optimizer_type: adamw}
            ReconGeneration: {learning_rate: *ad_head_lr, optimizer_type: adamw}
    data:
      train: ["${ANOMALY_DATA}/SB/data.parquet"]
      fold: {count: 5, index: 0}
      evaluation: ["${ANOMALY_DATA}/SR/data.parquet"]
      train_fraction: 1.0
      event_id_columns: []
      assets:
        normalization.pt: ${ANOMALY_DATA}/SB/normalization.pt
        shape_metadata.json: ${ANOMALY_DATA}/SB/shape_metadata.json
    evaluation:
      kind: anomaly
      generated_events: 20000
      max_background: 2000
      metric_paths:
        calibration_magnitude: [before cut, mean_calibration_difference]
        coverage: [after cut, cov]
        mmd: [after cut, mmd]
        selection_efficiency: [after cut, efficiency]
      display:
        - {key: calibration_magnitude, label: "Calibration magnitude", direction: min, headline: true}
        - {key: coverage, label: "Coverage", direction: max}
        - {key: mmd, label: "Native JetNet MMD", direction: min}
        - {key: selection_efficiency, label: "Selection efficiency", direction: none}

  grid:
    enabled: false
    reason: "EveNet-Lite shares core components but does not wire PairCreator/IterativeUpdate or pair-aware classification."

# Optional; only used by prepare --pretraining and benchmark.pretrain.
# Keep the architecture fixed when studying objectives or training recipes.
pretraining:
  train_yaml: ${PRETRAIN_YAML}
  normalization_asset: normalization.pt
  data:
    train: ["${PRETRAIN_DATA}/*.parquet"]
    validation: ["${PRETRAIN_VAL_DATA}/*.parquet"]
    train_fraction: 0.1
    event_id_columns: []
    assets:
      normalization.pt: ${PRETRAIN_DATA}/normalization.pt
      shape_metadata.json: ${PRETRAIN_DATA}/shape_metadata.json
  overrides:
    platform:
      number_of_workers: 1
      resources_per_worker: {CPU: 8, GPU: 1}
      batch_size: 512
    options:
      Training:
        total_epochs: 5
        epochs: 5
