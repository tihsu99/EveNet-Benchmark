schema_version: 1
label: Paper Results
model: Fully pretrained EveNet with task adaptation
description: Archived paper plotting data; external context, not a matched-budget ablation.
source_repository: EveNet_Result_Plot
benchmark_order:
- qe
- exotic_higgs_cls
- exotic_higgs_asn
- exotic_higgs_seg
- exotic_higgs
- anomaly
benchmarks:
  qe:
    headline: observable_uncertainty
    source: data/QE_results_table.csv
    source_sha256: b55c94bf4986abb58dcf42f47521cd18464556ac0e9dea0110cfe279ee47c378
    selection:
      model: Nominal
      train_size: 148
      training_fraction: 0.05
      paper_reference_events: 1000000
      paper_training_fraction: 0.148
      paper_training_label: 15%
    context: Fully pretrained Nominal model, 148 K training events; 5% of the archived 2950 K full sample,
      but approximately 15% of the paper reference dataset of 1 M events. Stored absolute concurrence uncertainty.
      Historical table lacks truth bias, selection efficiency and covariance. Pairing accuracy is not selection
      efficiency. No paper 5% (50 K) row is available in this table; this is not a matched paper-5% reference.
      Identical probe events, selections and training schedule are not certified.
    plot_context: 'Full model, 148 K events (paper: 15% of 1 M; archive: 5% of 2950 K). Statistical concurrence
      uncertainty; no paper 5% row available.'
    metrics:
      trace_abs_bias: null
      observable_abs_bias: null
      observable_uncertainty: 0.005110662
      selection_efficiency: null
  exotic_higgs:
    headline: auc
    source: data/BSM/fit/evenet-pretrain-ablation4-assignment-on-segmentation-on-dataset_size0.01/summary/roc_results.npz
    source_sha256: 4d936ef60cab7f136100cd7966840b031dd3ab45bc1c76041a927b5ec37c7386
    selection:
      mass: haa_ma30
      region: SR
      training_fraction: 0.01
      assignment: true
      segmentation: true
      training_events: 10000
      paper_reference_events: 200000
      paper_training_fraction: 0.05
      paper_training_label: 5%
    context: The paper 5% reference is 10 K events (5% of 200 K; archive dataset_size0.01 of 1 M). The archived
      Cls+Asn+Seg file contains masses 40 and 60 GeV, but no 30 GeV result. Metrics are unavailable; no substitution
      from a larger training sample.
    plot_context: 'Cls+Asn+Seg, mass 30 GeV: no archived paper-5% (10 K events) result.'
    metrics:
      auc: null
      background_rejection: null
      sic: null
  anomaly:
    headline: calibration_magnitude
    source: data/AD/boostrap_summary.json
    source_sha256: e3a918137e52b5543fbd8e2a858600c00ca052491c4193138363ccbe8ed14941
    selection:
      model: EveNet-f.t.(Cls+Gen)-calibrated-OS
      aggregation: median
      entries: 8
    context: Full model, calibrated OS sample; median of the 8 archived ensemble entries, matching the paper
      plotting aggregation. Calibration magnitude comes from before cut; coverage, MMD and efficiency come
      from after cut. Values remain fractions/native units, not paper percentage labels. This is an ensemble
      reference, not the probe's single fixed fold. Confirm OS selection when configuring the probe data paths.
      Bands are the 16th to 84th percentiles of archived entries, not uncertainty on the median or a probe
      seed CI.
    plot_context: Full model, calibrated OS; median of 8 entries. Bands = 16-84% ensemble spread, not a confidence
      interval on the median.
    metrics:
      calibration_magnitude: 0.11564856757357475
      coverage: 0.5154000000000001
      mmd: 0.872636770538874
      selection_efficiency: 0.9559669362768288
    intervals:
      calibration_magnitude:
        low: 0.10933162215576764
        high: 0.12123600354893355
        label: 16-84% ensemble
      coverage:
        low: 0.508768
        high: 0.516152
        label: 16-84% ensemble
      mmd:
        low: 0.8683521771747803
        high: 0.8789762066077949
        label: 16-84% ensemble
      selection_efficiency:
        low: 0.9545605575094999
        high: 0.9616784628269053
        label: 16-84% ensemble
  exotic_higgs_cls:
    headline: auc
    source: data/BSM/fit/evenet-pretrain-ablation4-assignment-off-segmentation-off-dataset_size0.01/summary/roc_results.npz
    source_sha256: 91d86743477959b7ea90f30f030a164f6602552eec41b9c67bd00b9ededde2aa
    selection:
      mass: haa_ma30
      region: SR
      training_fraction: 0.01
      head: Cls
      assignment: false
      segmentation: false
      training_events: 10000
      paper_reference_events: 200000
      paper_training_fraction: 0.05
      paper_training_label: 5%
    context: 'Fully pretrained model, Cls, mass 30 GeV, 10 K training events: 5% of the paper reference dataset
      (200 K), corresponding to archive dataset_size0.01 (1% of 1 M). Stored SR weighted AUC. Rejection and
      SIC at first stored TPR >= 0.7: TPR=0.7007007007007007, FPR=0.2139446806673692, sigma_FPR=0.009853293030681715.
      Native first-order uncertainty propagation at fixed TPR: sigma_R=sigma_FPR/FPR^2; sigma_SIC=0.5*TPR*sigma_FPR/FPR^1.5.
      SIC is not the paper maximum SIC. Histogram-weight uncertainty excludes signal-efficiency and model uncertainty.
      Probe train_fraction=0.01 matches the raw archive fraction and is applied after validation splitting.
      Actual training counts depend on the input rows; identical events and training budgets are not certified.'
    plot_context: 'Mass 30 GeV; paper 5% = 10 K / 200 K events (archive: 1% of 1 M). Each head has its own
      reference; bands propagate native FPR uncertainty at fixed TPR.'
    metrics:
      auc: 0.8127534359025557
      background_rejection: 4.6741054597882306
      sic: 1.5148924644193604
    intervals:
      background_rejection:
        low: 4.458837986869812
        high: 4.8893729327066495
        label: Native FPR propagation
      sic:
        low: 1.4800080276683882
        high: 1.5497769011703326
        label: Native FPR propagation
