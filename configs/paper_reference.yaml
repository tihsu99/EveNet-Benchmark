      Native first-order uncertainty propagation at fixed TPR: sigma_R=sigma_FPR/FPR^2; sigma_SIC=0.5*TPR*sigma_FPR/FPR^1.5.
      SIC is not the paper maximum SIC. Histogram-weight uncertainty excludes signal-efficiency and model uncertainty.
      Probe train_fraction=0.01 matches the raw archive fraction and is applied after validation splitting.
