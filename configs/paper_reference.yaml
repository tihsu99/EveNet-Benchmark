    source_sha256: f57571a637cf64be6df18085ef8d5e20554f17d9b35e7ecc449d984b93a06a92
    selection:
      mass: haa_ma30
      region: SR
      training_fraction: 1.0
      head: Cls+Seg
      assignment: false
      segmentation: true
    context: 'Fully pretrained model, Cls+Seg, mass 30 GeV, 100% training. Stored SR weighted AUC. Rejection and
      SIC at first stored TPR >= 0.7: TPR=0.7007007007007007, FPR=0.09187717802549668, sigma_FPR=0.004323518869019249.
      Native first-order uncertainty propagation at fixed TPR: sigma_R=sigma_FPR/FPR^2; sigma_SIC=0.5*TPR*sigma_FPR/FPR^1.5.
      Histogram-weight uncertainty excludes signal-efficiency and model uncertainty. External paper selection and
