plot_style:
  font_family: [Graphik Naturel, GraphikNaturel, Arial, DejaVu Sans]
  title_font_family: [Harding, HardingText, Times New Roman, DejaVu Serif]
  font_scale: 1.12
  width: 18
  table_header_color: '#D8D7C3'
  table_row_color: '#ECEBE1'
  table_rule_width: 0.55
  table_significant_digits: 4
  table_number_max_chars: 7
  improvement_decimals: 1
  summary_label_widths: [3.0, 3.4]
  summary_reference_width: 2.8
  summary_checkpoint_width: 2.4
  source: '42256_2026_1322_Author.pdf, page 4 Table 1 (typography and table); EveNet_Result_Plot/plot_styles (model palette and axes)'
  head_linestyles:
    Cls: '-'
    Cls+Asn: --
    Cls+Seg: -.
  model_styles:
    Scratch demo:
      color: '#E69F00'
      marker: ^
    V1 demo:
      color: '#0072B2'
      marker: s
    Pair demo:
      color: '#D55E00'
      marker: o
