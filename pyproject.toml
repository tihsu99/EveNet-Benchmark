[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evenet-benchmark"
version = "0.1.0"
description = "Fixed-data checkpoint probes for EveNet"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24", "pyarrow>=14", "matplotlib>=3.7", "tqdm>=4.66", "huggingface_hub>=1.0"]

[project.optional-dependencies]
classification = ["torch>=2", "scikit-learn>=1.3"]
# Host driver, Higgs evaluation, and native AD generation/evaluation.
# Scientific pins follow the public AD recipe selected by configs/workflow.yaml.
host = [
    "ray[data,train]==2.44.1",
    "torch==2.6.0",
    "lightning==2.5.1",
    "numpy==1.26.4",
    "pyarrow==19.0.1",
    "scikit-learn==1.6.1",
    "wandb==0.19.8",
    "numba==0.61.0",
    "opt-einsum==3.4.0",
    "rich==14.0.0",
    "sympy>=1.12",
    "pandas>=2",
    "scipy>=1.10",
    "awkward==2.8.1",
    "vector==1.6.1",
    "numdifftools==0.9.41",
    "jetnet==0.2.5",
    "zfit==0.22.0",
    "setuptools==78.1.0",
]
# Python dependencies only; keep the existing ROOT/RooUnfold installation.
quantum = [
    # Older recipe wheels do not support Python 3.14.
    "torch==2.6.0; python_version < '3.14'",
    "torch>=2.9,<3; python_version >= '3.14'",
    "pandas>=2",
    "scipy>=1.10",
    "awkward==2.8.1; python_version < '3.14'",
    "awkward>=2.8.1,<3; python_version >= '3.14'",
    "vector==1.6.1",
    "uproot==5.6.0",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["benchmark*"]

[project.scripts]
evenet-probe-prepare = "benchmark.prepare:main"
evenet-probe-run = "benchmark.run:main"
evenet-probe-pretrain = "benchmark.pretrain:main"
evenet-probe-plot = "benchmark.plot:main"
evenet-benchmark = "benchmark.workflow:main"
